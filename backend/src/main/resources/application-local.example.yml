spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cars_recommend_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: your_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  auth:
    enabled: true
    jwt-secret: change-this-local-development-secret-please-keep-at-least-32-bytes
    token-expire-seconds: 7200
  storage:
    car-image-root: .run/uploads/car-images
